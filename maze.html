<title>미로찾기</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
  :root{
    --ground:#0E2740;
    --panel:#143453;
    --panel-2:#1B4066;
    --hair:#5E92C2;
    --hair-soft:rgba(94,146,194,.28);
    --ink:#E6F0F9;
    --ink-dim:#9FBDD8;
    --marker:#FF7A3D;
    --amber:#F0B429;
    --stroke:rgba(230,240,249,.16);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--ground);
    color:var(--ink);
    font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
    padding-block:24px 32px;
    padding-inline:16px;
    display:flex;
    justify-content:center;
    background-image:
      linear-gradient(var(--hair-soft) 1px,transparent 1px),
      linear-gradient(90deg,var(--hair-soft) 1px,transparent 1px);
    background-size:28px 28px;
    background-position:-1px -1px;
  }
  .sheet{
    width:100%;
    max-width:560px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .titleblock{
    border:1px solid var(--stroke);
    background:var(--panel);
    display:grid;
    grid-template-columns:1fr auto;
    align-items:end;
    gap:12px;
    padding:12px 14px;
  }
  .eyebrow{
    font-family:"IBM Plex Mono",monospace;
    font-size:11px;
    letter-spacing:.18em;
    color:var(--ink-dim);
    margin:0 0 4px;
  }
  h1{
    font-family:"Do Hyeon",system-ui,sans-serif;
    font-weight:400;
    font-size:clamp(26px,7vw,34px);
    line-height:1;
    margin:0;
    text-wrap:balance;
  }
  .stats{
    display:flex;
    gap:18px;
    font-family:"IBM Plex Mono",monospace;
    font-variant-numeric:tabular-nums;
  }
  .stat{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
  .stat b{font-size:19px;font-weight:600;line-height:1}
  .stat span{font-size:10px;letter-spacing:.14em;color:var(--ink-dim)}
  .plate{position:relative;border:1px solid var(--stroke);background:var(--panel)}
  canvas{display:block;width:100%;height:auto;max-width:100%;touch-action:none}
  .overlay{
    position:absolute;inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:20px;
    text-align:center;
    background:rgba(14,39,64,.9);
  }
  .overlay.show{display:flex}
  .overlay h2{
    font-family:"Do Hyeon",system-ui,sans-serif;
    font-weight:400;font-size:30px;margin:0;color:var(--amber);
  }
  .overlay p{
    margin:0;font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink-dim);
    font-variant-numeric:tabular-nums;
  }
  .controls{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
  .buttons{display:flex;gap:8px;flex-wrap:wrap}
  button{
    font-family:"IBM Plex Sans KR",sans-serif;
    font-size:14px;font-weight:500;
    color:var(--ink);
    background:var(--panel-2);
    border:1px solid var(--stroke);
    padding:10px 14px;
    cursor:pointer;
    transition:background .12s ease,border-color .12s ease;
  }
  button:hover{background:#245080;border-color:var(--hair)}
  button:active{background:#2C5C92}
  button:focus-visible{outline:2px solid var(--marker);outline-offset:2px}
  .note{font-size:12px;color:var(--ink-dim);line-height:1.9;margin:0;max-width:34ch}
  kbd{
    font-family:"IBM Plex Mono",monospace;font-size:11px;
    border:1px solid var(--stroke);padding:1px 5px;color:var(--ink);
  }
  .primary{background:var(--marker);border-color:var(--marker);color:#22160E;font-weight:600}
  .primary:hover{background:#FF8D58;border-color:#FF8D58}
  @media (max-width:430px){
    .titleblock{grid-template-columns:1fr}
    .stats{justify-content:flex-start}
    .stat{align-items:flex-start}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="sheet">
  <div class="titleblock">
    <div>
      <p class="eyebrow">DWG. NO. <span id="seed">1015</span> · 탐색 도면</p>
      <h1>미로찾기</h1>
    </div>
    <div class="stats">
      <div class="stat"><b id="level">1</b><span>LEVEL</span></div>
      <div class="stat"><b id="time">0.0</b><span>TIME</span></div>
      <div class="stat"><b id="steps">0</b><span>STEPS</span></div>
    </div>
  </div>

  <div class="plate">
    <canvas id="c" width="520" height="520" aria-label="미로 도면"></canvas>
    <div class="overlay" id="overlay" role="dialog" aria-live="polite">
      <h2 id="ovTitle">도착</h2>
      <p id="ovBody"></p>
      <button class="primary" id="next">다음 레벨 →</button>
    </div>
  </div>

  <div class="controls">
    <p class="note"><kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 방향키 또는 <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> 로 움직입니다.</p>
    <div class="buttons">
      <button id="hint">힌트 보기 (+3초)</button>
      <button id="reset">이 미로 다시 시작</button>
    </div>
  </div>
</div>

<script>
(function(){
  var cv=document.getElementById('c'), ctx=cv.getContext('2d');
  function $(id){ return document.getElementById(id); }
  var DIRS=[[0,-1],[1,0],[0,1],[-1,0]]; // 상 우 하 좌

  var N,cells,px,py,level,steps,startTime,penalty,running,done,trail,hintPath,hintUntil,cssSize;

  function buildMaze(n){
    var g=[],i;
    for(i=0;i<n*n;i++) g.push([true,true,true,true]); // 상 우 하 좌
    var seen=new Uint8Array(n*n), stack=[0];
    seen[0]=1;
    while(stack.length){
      var cur=stack[stack.length-1];
      var cx=cur%n, cy=(cur-cx)/n, open=[];
      for(var d=0;d<4;d++){
        var nx=cx+DIRS[d][0], ny=cy+DIRS[d][1];
        if(nx<0||ny<0||nx>=n||ny>=n) continue;
        if(!seen[ny*n+nx]) open.push(d);
      }
      if(!open.length){ stack.pop(); continue; }
      var dd=open[(Math.random()*open.length)|0];
      var mx=cx+DIRS[dd][0], my=cy+DIRS[dd][1], nxt=my*n+mx;
      g[cur][dd]=false; g[nxt][(dd+2)%4]=false;
      seen[nxt]=1; stack.push(nxt);
    }
    return g;
  }

  function solve(){
    var goal=N*N-1, start=py*N+px;
    var prev=new Int32Array(N*N).fill(-1);
    var q=[start]; prev[start]=start;
    for(var h=0;h<q.length;h++){
      var cur=q[h];
      if(cur===goal) break;
      var cx=cur%N, cy=(cur-cx)/N;
      for(var d=0;d<4;d++){
        if(cells[cur][d]) continue;
        var nx=cx+DIRS[d][0], ny=cy+DIRS[d][1], nxt=ny*N+nx;
        if(prev[nxt]!==-1) continue;
        prev[nxt]=cur; q.push(nxt);
      }
    }
    var path=[], cur2=goal;
    while(cur2!==start){ path.push(cur2); cur2=prev[cur2]; }
    path.push(start);
    return path;
  }

  function newLevel(keepMaze){
    N=8+level*2;
    if(!keepMaze||!cells) cells=buildMaze(N);
    px=0; py=0; steps=0; penalty=0; startTime=0; running=false; done=false;
    trail=new Uint8Array(N*N); trail[0]=1;
    hintPath=null; hintUntil=0;
    $('overlay').classList.remove('show');
    $('level').textContent=level;
    $('steps').textContent='0';
    $('time').textContent='0.0';
    $('seed').textContent=String(1000+level*37+N);
    layout(); draw();
  }

  function layout(){
    var dpr=Math.min(window.devicePixelRatio||1,2);
    cssSize=Math.min(cv.parentElement.clientWidth,560);
    cv.style.height=cssSize+'px';
    cv.width=Math.round(cssSize*dpr);
    cv.height=Math.round(cssSize*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  function elapsed(){
    if(!startTime) return penalty;
    return (performance.now()-startTime)/1000+penalty;
  }

  function draw(){
    var S=cssSize, pad=14, inner=S-pad*2, cs=inner/N, i,x,y;
    ctx.clearRect(0,0,S,S);
    ctx.fillStyle='#143453'; ctx.fillRect(0,0,S,S);

    // 방안지
    ctx.strokeStyle='rgba(94,146,194,.16)'; ctx.lineWidth=1;
    ctx.beginPath();
    for(i=0;i<=N;i++){
      var p=Math.round(pad+i*cs)+.5;
      ctx.moveTo(p,pad); ctx.lineTo(p,pad+inner);
      ctx.moveTo(pad,p); ctx.lineTo(pad+inner,p);
    }
    ctx.stroke();

    // 지나온 자취
    ctx.fillStyle='rgba(255,122,61,.13)';
    for(i=0;i<N*N;i++){
      if(!trail[i]) continue;
      x=i%N; y=(i-x)/N;
      ctx.fillRect(pad+x*cs+1,pad+y*cs+1,cs-2,cs-2);
    }

    // 힌트 경로
    if(hintPath&&performance.now()<hintUntil){
      ctx.strokeStyle='rgba(240,180,41,.85)';
      ctx.lineWidth=Math.max(2,cs*.18);
      ctx.lineCap='round'; ctx.lineJoin='round';
      ctx.beginPath();
      for(i=0;i<hintPath.length;i++){
        var id=hintPath[i], hx=id%N, hy=(id-hx)/N;
        var ax=pad+hx*cs+cs/2, ay=pad+hy*cs+cs/2;
        if(i===0) ctx.moveTo(ax,ay); else ctx.lineTo(ax,ay);
      }
      ctx.stroke();
    }

    // 도착점
    var gx=pad+(N-1)*cs, gy=pad+(N-1)*cs;
    ctx.fillStyle='rgba(240,180,41,.38)';
    ctx.fillRect(gx+2,gy+2,cs-4,cs-4);
    ctx.strokeStyle='#F0B429'; ctx.lineWidth=1.5;
    ctx.strokeRect(gx+3.5,gy+3.5,cs-7,cs-7);
    ctx.fillStyle='#F0B429';
    ctx.beginPath(); ctx.arc(gx+cs/2,gy+cs/2,Math.max(2,cs*.14),0,Math.PI*2); ctx.fill();

    // 벽
    ctx.strokeStyle='#E6F0F9';
    ctx.lineWidth=Math.max(1.5,cs*.09);
    ctx.lineCap='square';
    ctx.beginPath();
    for(y=0;y<N;y++) for(x=0;x<N;x++){
      var w=cells[y*N+x], X=pad+x*cs, Y=pad+y*cs;
      if(w[0]){ ctx.moveTo(X,Y); ctx.lineTo(X+cs,Y); }
      if(w[3]){ ctx.moveTo(X,Y); ctx.lineTo(X,Y+cs); }
      if(x===N-1&&w[1]){ ctx.moveTo(X+cs,Y); ctx.lineTo(X+cs,Y+cs); }
      if(y===N-1&&w[2]){ ctx.moveTo(X,Y+cs); ctx.lineTo(X+cs,Y+cs); }
    }
    ctx.stroke();

    // 플레이어
    var cxp=pad+px*cs+cs/2, cyp=pad+py*cs+cs/2, r=Math.max(3,cs*.27);
    ctx.fillStyle='rgba(255,122,61,.25)';
    ctx.beginPath(); ctx.arc(cxp,cyp,r*1.9,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#FF7A3D';
    ctx.beginPath(); ctx.arc(cxp,cyp,r,0,Math.PI*2); ctx.fill();
  }

  function move(d){
    if(done) return;
    if(cells[py*N+px][d]) return;
    px+=DIRS[d][0]; py+=DIRS[d][1];
    steps++; trail[py*N+px]=1;
    if(!startTime){ startTime=performance.now(); running=true; }
    $('steps').textContent=steps;
    if(px===N-1&&py===N-1) finish();
    draw();
  }

  function finish(){
    done=true; running=false;
    var t=elapsed().toFixed(1);
    $('time').textContent=t;
    $('ovTitle').textContent='레벨 '+level+' 클리어';
    $('ovBody').textContent=t+'초 · '+steps+'걸음 · '+N+'×'+N+' 격자';
    $('overlay').classList.add('show');
    $('next').focus();
  }

  function tick(){
    if(running&&!done) $('time').textContent=elapsed().toFixed(1);
    if(hintPath&&performance.now()>hintUntil){ hintPath=null; draw(); }
    requestAnimationFrame(tick);
  }

  var KEYS={ArrowUp:0,KeyW:0,ArrowRight:1,KeyD:1,ArrowDown:2,KeyS:2,ArrowLeft:3,KeyA:3};
  window.addEventListener('keydown',function(e){
    if(!(e.code in KEYS)) return;
    e.preventDefault();
    move(KEYS[e.code]);
  });

  $('next').addEventListener('click',function(){ level++; newLevel(false); });
  $('reset').addEventListener('click',function(){ newLevel(true); });
  $('hint').addEventListener('click',function(){
    if(done) return;
    if(!startTime){ startTime=performance.now(); running=true; }
    penalty+=3; hintPath=solve(); hintUntil=performance.now()+1400; draw();
  });

  var sx=0,sy=0,tracking=false;
  cv.addEventListener('pointerdown',function(e){ sx=e.clientX; sy=e.clientY; tracking=true; });
  cv.addEventListener('pointerup',function(e){
    if(!tracking) return;
    tracking=false;
    var dx=e.clientX-sx, dy=e.clientY-sy;
    if(Math.hypot(dx,dy)<24) return;
    move(Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0));
  });

  window.addEventListener('resize',function(){ layout(); draw(); });

  function start(state){
    level=(state&&state.level)||1;
    newLevel(false);
    tick();
  }
  if(window.claude&&window.claude.hot&&window.claude.hot.snapshot) window.claude.hot.snapshot(function(){ return {level:level}; });
  if(window.claude&&window.claude.hot&&window.claude.hot.ready) window.claude.hot.ready(start);
  else start({});
})();
</script>
